            if (savedTheme) {

            } else {

                document.documentElement.setAttribute('data-bs-theme', prefersDark ? 'dark' : 'light');

</div>





<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    
    const noticeContent = document.getElementById("noticeContent");
    if (noticeContent) {
        noticeContent.innerHTML = marked.parse(noticeContent.innerText);
    }
    
    
    if (document.getElementById("editor_notice")) {
        new EasyMDE({element: document.getElementById('editor_notice')});
    }

    
    const daysOfWeek = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "Chủ nhật"];
    
    
    let weeklySchedule = [];
    try {
        const rawData = `[\u007b\u0022day\u0022: \u0022Thứ 5\u0022, \u0022end\u0022: \u002211:00\u0022, \u0022start\u0022: \u002210:50\u0022, \u0022subject\u0022: \u0022Tú\u0022\u007d]`;
        weeklySchedule = JSON.parse(rawData);
        if (!Array.isArray(weeklySchedule)) weeklySchedule = [];
    } catch(e) {
        weeklySchedule = [];
    }

    const scheduleView = document.getElementById("weeklyScheduleView");
    const editorContainer = document.getElementById("scheduleSlotsContainer");
    const weeklyInput = document.getElementById("weeklyScheduleInput");

    
    function renderScheduleView() {
        if (!scheduleView) return;
        if (weeklySchedule.length === 0) {
            scheduleView.innerHTML = `<div class="text-center text-muted py-4">Chưa có lịch học.</div>`;
            return;
        }

        
        const sorted = [...weeklySchedule].sort((a, b) => {
            const dayA = daysOfWeek.indexOf(a.day);
            const dayB = daysOfWeek.indexOf(b.day);
            if (dayA !== dayB) return dayA - dayB;
            return a.start.localeCompare(b.start);
        });

        
        let html = '';
        let currentDay = '';
        sorted.forEach(slot => {
            if (slot.day !== currentDay) {
                if (currentDay !== '') html += `</div></div>`;
                currentDay = slot.day;
                html += `
                <div class="card border-0 bg-light">
                    <div class="card-header bg-primary text-white fw-bold py-2"><i class="bi bi-calendar-day"></i> ${currentDay}</div>
                    <div class="list-group list-group-flush border-0">`;
            }
            html += `
                <div class="list-group-item bg-transparent d-flex justify-content-between align-items-center">
                    <div>
                        <span class="badge bg-secondary me-2"><i class="bi bi-clock"></i> ${slot.start} - ${slot.end}</span>
                        <span class="fw-bold text-dark">${slot.subject}</span>
                    </div>
                </div>`;
        });
        if (currentDay !== '') html += `</div></div>`;
        scheduleView.innerHTML = html;
    }

    
    window.renderScheduleEditor = function() {
        if (!editorContainer) return;
        editorContainer.innerHTML = '';
        if (weeklySchedule.length === 0) {
            editorContainer.innerHTML = '<div class="text-muted text-center py-2">Nhấn "Thêm ca học" để bắt đầu.</div>';
        }
        
        weeklySchedule.forEach((slot, index) => {
            const div = document.createElement("div");
            div.className = "d-flex gap-2 align-items-center bg-white p-2 rounded shadow-sm border";
            
            let dayOptions = daysOfWeek.map(d => `<option value="${d}" ${slot.day === d ? 'selected' : ''}>${d}</option>`).join("");
            
            div.innerHTML = `
                <select class="form-select form-select-sm" style="width: 120px;" onchange="updateScheduleSlot(${index}, 'day', this.value)">
                    ${dayOptions}
                </select>
                <input type="time" class="form-control form-control-sm" style="width: 110px;" value="${slot.start}" onchange="updateScheduleSlot(${index}, 'start', this.value)" required>
                <span>-</span>
                <input type="time" class="form-control form-control-sm" style="width: 110px;" value="${slot.end}" onchange="updateScheduleSlot(${index}, 'end', this.value)" required>
                <input type="text" class="form-control form-control-sm flex-grow-1" placeholder="Môn học/Nội dung" value="${slot.subject}" oninput="updateScheduleSlot(${index}, 'subject', this.value)" required>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeScheduleSlot(${index})"><i class="bi bi-trash"></i></button>
            `;
            editorContainer.appendChild(div);
        });
        
        if (weeklyInput) {
            weeklyInput.value = JSON.stringify(weeklySchedule);
        }
    };

    window.addScheduleSlot = function() {
        weeklySchedule.push({ day: "Thứ 2", start: "08:00", end: "10:00", subject: "" });
        renderScheduleEditor();
    };

    window.updateScheduleSlot = function(index, field, value) {
        if(weeklySchedule[index]) {
            weeklySchedule[index][field] = value;
            if (weeklyInput) weeklyInput.value = JSON.stringify(weeklySchedule);
        }
    };

    window.removeScheduleSlot = function(index) {
        weeklySchedule.splice(index, 1);
        renderScheduleEditor();
    };

    renderScheduleView();
    renderScheduleEditor();

    
    const urlParams = new URLSearchParams(window.location.search);
    const activeTab = urlParams.get('tab');
    if (activeTab) {
        const tabEl = document.querySelector(`button[data-bs-target="#${activeTab}"]`);
        if (tabEl) {
            new bootstrap.Tab(tabEl).show();
        }
    }
});
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const themeIcon = themeToggleBtn.querySelector('i');
            
            function updateIcon(theme) {
                if (theme === 'dark') {
                    themeIcon.className = 'bi bi-sun-fill text-warning';
                } else {
                    themeIcon.className = 'bi bi-moon-stars-fill';
                }
            }

            
            updateIcon(document.documentElement.getAttribute('data-bs-theme'));

            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-bs-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateIcon(newTheme);
            });
        });
    </script>
