{{ define "page" }}
<div class="container">
    <h2>Problem Set</h2>
    <table class="table">
        <thead>
            <tr>
                <th>Status</th>
                <th>Task</th>
                <th>Category</th>
            </tr>
        </thead>
        <tbody>
            {{ range .Data.Problems }}
            <tr>
                <td>-</td>
                <td>
                    <a href="/problems/{{ .Slug }}">{{ .Title }}</a>
                    {{ if $.User }}
                        {{ if eq $.User.Role "admin" }}
                            <a href="/admin/problems/{{ .Slug }}/edit" style="margin-left: 10px; font-size: 0.85em; color: #ff9800;">[Edit]</a>
                        {{ end }}
                    {{ end }}
                </td>
                <td>{{ .Category }}</td>
            </tr>
            {{ else }}
            <tr>
                <td colspan="3">No problems found.</td>
            </tr>
            {{ end }}
        </tbody>
    </table>
</div>
{{ end }}
