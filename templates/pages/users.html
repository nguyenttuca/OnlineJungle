{{ define "page" }}
<div class="container">
    <h2>Leaderboard</h2>
    <div class="card">
        <table class="table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>User</th>
                    <th>Display Name</th>
                    <th>Solved Problems</th>
                </tr>
            </thead>
            <tbody>
                {{ range $index, $user := .Data.Users }}
                <tr>
                    <td><strong>#{{ add $index 1 }}</strong></td>
                    <td>
                        <a href="/users/{{ $user.Username }}" style="text-decoration: none; font-weight: bold; {{ if eq $user.Role "admin" }}color: #ff9800;{{ else }}color: var(--primary-color);{{ end }}">
                            {{ $user.Username }}
                        </a>
                    </td>
                    <td>{{ $user.DisplayName }}</td>
                    <td><span class="badge" style="background-color: #28a745;">{{ $user.SolvedCount }}</span></td>
                </tr>
                {{ else }}
                <tr>
                    <td colspan="4" style="text-align: center;">No users found.</td>
                </tr>
                {{ end }}
            </tbody>
        </table>
    </div>
</div>
{{ end }}
