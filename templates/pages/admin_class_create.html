{{ define "page" }}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0 text-gray-800">Tạo Lớp học mới</h2>
        <a href="/classes" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Quay lại
        </a>
    </div>

    {{ if .Data.Error }}
    <div class="alert alert-danger shadow-sm border-0 border-start border-danger border-4">
        {{ .Data.Error }}
    </div>
    {{ end }}

    <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <form action="/admin/classes/create" method="POST">
                <input type="hidden" name="csrf_token" value="{{ .CsrfToken }}">
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Tên Lớp học <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control form-control-lg" required placeholder="VD: Luyện thi HSG Tỉnh 2026">
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Mô tả ngắn <span class="text-danger">*</span></label>
                    <textarea name="description" class="form-control" rows="3" required placeholder="Giới thiệu nhanh về lớp học..."></textarea>
                </div>

                <div class="d-grid mt-5">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold"><i class="bi bi-plus-circle"></i> Tạo Lớp</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}
