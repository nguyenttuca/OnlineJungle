{{ define "page" }}
<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Submit Solution - {{ .Data.Problem.Title}}</h2>
        {{ if .Data.ContestID }}
        <a href="/contests/{{ .Data.ContestID }}/problems/{{ .Data.Problem.Slug}}" class="btn btn-outline-secondary">Trở về bài toán</a>
        {{ else }}
        <a href="/problems/{{ .Data.Problem.Slug}}" class="btn btn-outline-secondary">Trở về bài toán</a>
        {{ end }}
    </div>

    {{ if .Data.Error }}
    <div class="alert alert-danger">{{ .Data.Error }}</div>
    {{ end }}

    <div class="card shadow-sm border-0">
        <div class="card-body">
            {{ if .Data.ContestID }}
            <form action="/contests/{{ .Data.ContestID }}/problems/{{ .Data.Problem.Slug }}/submit" method="POST">
            {{ else }}
            <form action="/problems/{{ .Data.Problem.Slug }}/submit" method="POST">
            {{ end }}
                <input type="hidden" name="csrf_token" value="{{ .CsrfToken }}">
                <div class="mb-3">
                    <label for="language" class="form-label">Language:</label>
                    <select name="language" id="language" class="form-select w-25">
                        <option value="cpp">C++ (GCC)</option>
                        <option value="python">Python 3</option>
                        <option value="java">Java</option>
                    </select>
                </div>
                
                <div class="mb-3">
                    <label for="source_code" class="form-label">Source code:</label>
                    <textarea name="source_code" id="source_code" class="form-control" rows="20" style="font-family: monospace;" required></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary px-4">Submit</button>
            </form>
        </div>
    </div>
</div>
{{ end }}
